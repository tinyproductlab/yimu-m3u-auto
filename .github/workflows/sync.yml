name: 定时聚合播单

on:
  schedule:
    - cron: "17 */6 * * *"   # 每 6 小时跑一次（UTC，分针错开整点）
  workflow_dispatch:          # 也可在 Actions 页手动点 Run

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 拉取、去重、生成清单（云端不验活，理由见说明）
        run: python3 aggregate.py --no-check

      - name: 拆分子清单并生成站点页面（out/site）
        run: python3 build_site.py

      - name: 把最新清单与源缓存存回仓库（下次拉取失败时有兜底）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out cache
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "自动更新播单 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

      - name: 发布到 GitHub Pages
        uses: actions/deploy-pages@v4
